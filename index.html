<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rocket Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --space:#1B0F3B; --space-mid:#3A1E7A; --space-lo:#5B2E9E;
    --pink:#FF6BB5; --cyan:#3DE0F0; --lime:#9BE564;
    --sunny:#FFD84D; --coral:#FF6B6B; --cream:#FFF6E5; --moon:#D9C8F5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Fredoka','Trebuchet MS',Verdana,system-ui,sans-serif;
    background:var(--space);color:var(--cream);overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  #stage{
    position:relative;flex:1;overflow:hidden;min-height:0;min-width:0;user-select:none;
    background:
      radial-gradient(80% 50% at 20% 12%, rgba(255,107,181,.22) 0%, transparent 60%),
      radial-gradient(70% 45% at 82% 26%, rgba(61,224,240,.18) 0%, transparent 62%),
      linear-gradient(180deg, var(--space) 0%, #2A1358 46%, var(--space-mid) 80%, var(--space-lo) 100%);
  }
  .star{position:absolute;border-radius:50%;background:var(--cream)}

  /* ============ shared chrome ============ */
  .topbar{
    position:absolute;top:0;left:0;width:100%;z-index:12;
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 13px;gap:9px;pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .pill{
    display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:26px;
    background:rgba(255,246,229,.13);border:2px solid rgba(255,246,229,.2);
    font-size:14px;font-weight:600;
  }
  .pill .n{font-size:20px;font-weight:700;color:var(--sunny);font-variant-numeric:tabular-nums}
  .pill.cy .n{color:var(--cyan)}
  .icons{display:flex;gap:5px;align-items:center}
  .btn-icon{
    width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,246,229,.2);
    background:rgba(255,246,229,.1);color:var(--cream);cursor:pointer;
    display:grid;place-items:center;padding:0;flex:none;
  }
  .btn-icon svg{width:19px;height:19px;fill:currentColor}
  .btn-icon:active{transform:scale(.93)}
  .btn-icon:focus-visible{outline:3px solid var(--sunny);outline-offset:2px}
  .btn-icon.off{opacity:.45}

  .lifebar{display:flex;gap:4px}
  .lifebar svg{width:21px;height:21px}
  .lifebar .dim{opacity:.22}

  .banner{
    position:absolute;top:28%;left:0;width:100%;z-index:13;text-align:center;
    pointer-events:none;opacity:0;
  }
  .banner.show{animation:bIn 1.8s ease-out}
  .banner .big{
    font-size:clamp(38px,11vw,70px);font-weight:700;color:var(--sunny);
    text-shadow:0 5px 0 rgba(0,0,0,.22), 0 0 46px rgba(255,216,77,.5);
  }
  .banner .sub{font-size:18px;font-weight:500;margin-top:2px}
  @keyframes bIn{0%{opacity:0;transform:scale(.7)}16%{opacity:1;transform:scale(1.04)}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0}}

  .countdown{position:absolute;inset:0;z-index:15;display:grid;place-items:center;
    pointer-events:none;background:rgba(27,15,59,.45)}
  .countdown.hidden{display:none}
  .countdown .num{font-size:clamp(84px,24vw,180px);font-weight:700;color:var(--cream);
    text-shadow:0 6px 0 rgba(0,0,0,.25);animation:cd .85s ease-out}
  @keyframes cd{0%{transform:scale(1.9);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.75);opacity:0}}

  .praise{
    position:absolute;z-index:14;font-size:28px;font-weight:700;color:var(--sunny);
    pointer-events:none;text-shadow:0 3px 0 rgba(0,0,0,.2);
    animation:praise .85s ease-out forwards;transform:translate(-50%,-50%);
  }
  @keyframes praise{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-8deg)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}
    100%{opacity:0;transform:translate(-50%,-140%) scale(1)}
  }
  .spark{position:absolute;z-index:13;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:3px;pointer-events:none}

  .moonground{
    position:absolute;left:-6%;bottom:-10%;width:112%;height:19%;z-index:1;
    background:linear-gradient(180deg,#EDE3FF 0%, var(--moon) 46%, #A98CD8 100%);
    border-radius:50% 50% 0 0;
    box-shadow:0 -14px 44px rgba(217,200,245,.22);
  }
  .moonground::after{
    content:'';position:absolute;inset:0;border-radius:50% 50% 0 0;
    background:
      radial-gradient(ellipse 44px 15px at 14% 34%, rgba(150,128,196,.5) 60%, transparent 62%),
      radial-gradient(ellipse 30px 11px at 37% 52%, rgba(150,128,196,.42) 60%, transparent 62%),
      radial-gradient(ellipse 54px 17px at 66% 38%, rgba(150,128,196,.45) 60%, transparent 62%),
      radial-gradient(ellipse 26px 10px at 88% 55%, rgba(150,128,196,.38) 60%, transparent 62%);
  }

  /* the moon itself, hanging in the sky behind every screen */
  .bigmoon{
    position:absolute;top:11%;left:5%;z-index:1;pointer-events:none;
    width:clamp(104px, 23vw, 216px);aspect-ratio:1/1;border-radius:50%;
    background:
      radial-gradient(circle at 63% 31%, rgba(146,128,168,.5) 0 7%, transparent 7.6%),
      radial-gradient(circle at 41% 57%, rgba(146,128,168,.44) 0 11%, transparent 11.6%),
      radial-gradient(circle at 73% 66%, rgba(146,128,168,.38) 0 6%, transparent 6.6%),
      radial-gradient(circle at 27% 35%, rgba(146,128,168,.34) 0 5%, transparent 5.6%),
      radial-gradient(circle at 55% 82%, rgba(146,128,168,.3) 0 4%, transparent 4.6%),
      radial-gradient(circle at 30% 62%, rgba(146,128,168,.26) 0 3.4%, transparent 4%),
      radial-gradient(circle at 34% 29%, #FFFDF4 0%, #F1E8D8 46%, #D3C5B2 78%, #9E8BC6 100%);
    box-shadow:0 0 76px 26px rgba(228,216,255,.16), inset -15px -13px 34px rgba(58,30,110,.5);
  }
  /* a far-off ringed planet for depth */
  .planet{
    position:absolute;top:9%;right:7%;z-index:1;pointer-events:none;opacity:.5;
    width:clamp(42px, 9vw, 84px);aspect-ratio:1/1;
  }
  .planet .ball{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #FFB6DC 0%, var(--pink) 52%, #8E3570 100%);
    box-shadow:inset -6px -5px 14px rgba(58,30,110,.55);
  }
  .planet .ring{
    position:absolute;left:-32%;top:41%;width:164%;height:34%;
    border:4px solid rgba(255,246,229,.5);border-radius:50%;
    transform:rotate(-17deg);
  }

  /* ============ rocket ============ */
  .rocketwrap{position:absolute;z-index:9;will-change:left;transition:transform .14s ease-out}
  .rocketwrap svg{display:block;width:100%}
  .flame{transform-origin:38px 84px;animation:flame .28s ease-in-out infinite alternate}
  @keyframes flame{from{transform:scaleY(.72) scaleX(.92)}to{transform:scaleY(1.12)}}
  .rocketwrap.bump{animation:rbump .4s}
  @keyframes rbump{0%,100%{filter:none}20%{filter:brightness(1.9) saturate(.4)}}

  /* ============ HOME ============ */
  #home{overflow-y:auto;z-index:18;background:linear-gradient(180deg,rgba(27,15,59,.35) 0%,rgba(27,15,59,.7) 55%,rgba(27,15,59,.82) 100%)}
  .home-inner{max-width:560px;margin:0 auto;padding:22px 18px 30px;text-align:center}
  .avatar{
    width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;
    border:6px solid var(--sunny);box-shadow:0 7px 0 rgba(0,0,0,.28), 0 0 46px rgba(255,216,77,.3);
  }
  .avatar.sm{width:70px;height:70px;border-width:5px;margin-bottom:10px}
  h1{font-size:clamp(38px,9vw,58px);font-weight:700;line-height:1;color:var(--sunny);
     text-shadow:0 5px 0 rgba(0,0,0,.25), 0 0 50px rgba(255,216,77,.4)}
  .tagline{margin-top:9px;font-size:16px;font-weight:500;color:rgba(255,246,229,.78)}

  .gamegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:20px}
  .gamecard{
    padding:15px 12px 13px;border-radius:22px;cursor:pointer;text-align:center;
    border:3px solid rgba(255,246,229,.16);background:rgba(255,246,229,.08);
    color:var(--cream);font:inherit;transition:transform .1s;
  }
  .gamecard:active{transform:scale(.97)}
  .gamecard:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
  .gamecard svg{width:44px;height:44px;display:block;margin:0 auto 7px}
  .gamecard .gname{font-size:17px;font-weight:700}
  .gamecard .gdesc{font-size:12.5px;font-weight:500;color:rgba(255,246,229,.6);margin-top:3px;line-height:1.35}
  .gamecard .gbest{font-size:12px;font-weight:600;color:var(--sunny);margin-top:6px;min-height:15px}
  .gc1{border-color:rgba(255,216,77,.45)}
  .gc2{border-color:rgba(61,224,240,.45)}
  .gc3{border-color:rgba(155,229,100,.45)}
  .gc4{border-color:rgba(255,107,181,.45)}

  .settings{margin-top:22px;padding:16px 14px;border-radius:22px;
    background:rgba(255,246,229,.06);border:2px solid rgba(255,246,229,.12)}
  .group-label{font-size:15px;font-weight:600;color:var(--cyan);margin-bottom:8px}
  .group + .group{margin-top:16px}
  .choices{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .chip{
    flex:1 1 0;min-width:88px;padding:11px 8px;border-radius:15px;cursor:pointer;
    border:3px solid rgba(255,246,229,.18);background:rgba(255,246,229,.07);
    color:var(--cream);font:inherit;font-size:14.5px;font-weight:600;transition:transform .1s;
  }
  .chip:active{transform:scale(.96)}
  .chip[aria-pressed="true"]{border-color:var(--sunny);background:rgba(255,216,77,.2);color:var(--sunny)}
  .chip:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}

  /* ============ meteor mode ============ */
  .rock{position:absolute;z-index:6;transform:translate(-50%,-50%);will-change:top}
  .rock .trail{position:absolute;bottom:70%;left:50%;transform:translateX(-50%);
    width:16px;height:54px;border-radius:50% 50% 6px 6px;
    background:linear-gradient(180deg,rgba(255,216,77,0),rgba(255,216,77,.55),rgba(255,246,229,.9));filter:blur(1.5px)}
  .rock .face{position:absolute;top:-12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:2}
  .rock .eye{width:16px;height:16px;border-radius:50%;background:var(--cream);
    display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.14)}
  .rock .eye i{width:6.5px;height:6.5px;border-radius:50%;background:#2B1A4D;display:block;margin-top:3px}
  .rock .body{position:relative;padding:12px 18px 10px;border-radius:24px;white-space:nowrap;
    font-size:25px;font-weight:700;color:#3A2154;font-variant-numeric:tabular-nums;
    border-bottom:5px solid rgba(0,0,0,.16)}
  .rock.c1 .body{background:var(--sunny)}
  .rock.c2 .body{background:var(--pink);color:#4A1330}
  .rock.c3 .body{background:var(--lime);color:#2A4413}
  .rock.bonus .body{background:var(--cyan);color:#0B3A42}
  .rock.pop{animation:pop .3s ease-out forwards}
  @keyframes pop{to{transform:translate(-50%,-50%) scale(1.7) rotate(9deg);opacity:0}}

  .bolt{position:absolute;z-index:8;width:9px;margin-left:-4.5px;border-radius:6px;transform-origin:50% 100%;
    background:linear-gradient(180deg,rgba(61,224,240,0),var(--cyan) 35%,var(--cream) 100%);
    box-shadow:0 0 18px rgba(61,224,240,.9);animation:bolt .22s ease-out forwards;pointer-events:none}
  @keyframes bolt{0%{opacity:1}100%{opacity:0}}

  .dome{position:absolute;bottom:8%;width:80px;margin-left:-40px;z-index:4;transition:opacity .3s}
  .dome.bump{animation:dbump .45s}
  @keyframes dbump{0%,100%{transform:translateY(0)}30%{transform:translateY(6px) scale(.96)}}

  .answer{
    position:absolute;bottom:2%;left:50%;transform:translateX(-50%);z-index:11;
    min-width:150px;min-height:58px;padding:8px 22px;border-radius:19px;text-align:center;
    background:rgba(27,15,59,.78);border:4px solid var(--cyan);cursor:pointer;
    font-size:34px;font-weight:700;color:var(--cyan);font-variant-numeric:tabular-nums;
    box-shadow:0 0 26px rgba(61,224,240,.35);
  }
  .answer.empty{color:rgba(255,246,229,.45);font-size:16px;font-weight:500;padding-top:19px}
  .answer.wrong{animation:nope .34s;border-color:var(--coral);color:var(--coral)}
  @keyframes nope{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 10px))}75%{transform:translateX(calc(-50% + 10px))}}
  #sink{position:absolute;bottom:0;left:50%;width:1px;height:1px;opacity:0;border:0;padding:0;
    background:transparent;color:transparent;font-size:16px;z-index:1}
  #sink:focus{outline:none}

  /* ============ dash mode ============ */
  .gaterow{position:absolute;left:0;width:100%;z-index:6;will-change:top}
  .gate{
    position:absolute;transform:translate(-50%,-50%);
    width:96px;height:66px;border-radius:50%;display:grid;place-items:center;
    border:5px solid var(--cyan);background:rgba(61,224,240,.15);
    font-size:26px;font-weight:700;color:var(--cream);font-variant-numeric:tabular-nums;
    box-shadow:0 0 22px rgba(61,224,240,.35), inset 0 0 18px rgba(61,224,240,.25);
  }
  .gate.g2{border-color:var(--pink);background:rgba(255,107,181,.15);box-shadow:0 0 22px rgba(255,107,181,.35), inset 0 0 18px rgba(255,107,181,.25)}
  .gate.g3{border-color:var(--lime);background:rgba(155,229,100,.15);box-shadow:0 0 22px rgba(155,229,100,.35), inset 0 0 18px rgba(155,229,100,.25)}
  .gatebar{position:absolute;height:5px;border-radius:3px;background:rgba(255,246,229,.22);transform:translateY(-50%)}
  .askbox{
    position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:11;
    padding:9px 24px;border-radius:20px;background:rgba(27,15,59,.75);
    border:4px solid var(--sunny);white-space:nowrap;
    font-size:clamp(27px,6.6vw,40px);font-weight:700;color:var(--cream);
  }
  .askbox .op{color:var(--sunny);padding:0 .1em}

  /* ============ match mode ============ */
  .matchwrap{position:absolute;inset:0;display:grid;place-items:center;padding:74px 14px 16px;z-index:6}
  .matchgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;max-width:440px}
  .card{
    position:relative;aspect-ratio:1/1;border:none;background:none;padding:0;cursor:pointer;
    perspective:600px;font:inherit;
  }
  .cardin{
    position:absolute;inset:0;transition:transform .38s;transform-style:preserve-3d;
  }
  .card.flip .cardin{transform:rotateY(180deg)}
  .cface{
    position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    font-size:clamp(15px,4.2vw,22px);font-weight:700;font-variant-numeric:tabular-nums;
  }
  .cback{background:linear-gradient(150deg,#6A3FC0,#3A1E7A);border:3px solid rgba(255,246,229,.22)}
  .cback svg{width:46%;height:46%;fill:rgba(255,216,77,.75)}
  .cfront{transform:rotateY(180deg);background:var(--sunny);color:#3A2154;border:3px solid rgba(0,0,0,.15)}
  .card.ans .cfront{background:var(--cyan);color:#0B3A42}
  .card.done{cursor:default}
  .card.done .cfront{background:var(--lime);color:#2A4413;animation:mpop .4s}
  @keyframes mpop{0%,100%{transform:rotateY(180deg) scale(1)}45%{transform:rotateY(180deg) scale(1.11)}}

  /* ============ quick mode ============ */
  .quickwrap{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;padding:68px 16px 16px;z-index:6}
  .statement{
    padding:20px 30px;border-radius:26px;background:rgba(27,15,59,.8);
    border:5px solid var(--sunny);white-space:nowrap;
    font-size:clamp(34px,9vw,60px);font-weight:700;font-variant-numeric:tabular-nums;
  }
  .statement.yes{border-color:var(--lime);animation:mpop2 .3s}
  .statement.no{border-color:var(--coral);animation:nope2 .3s}
  @keyframes mpop2{45%{transform:scale(1.06)}}
  @keyframes nope2{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .tfrow{display:flex;gap:14px;width:100%;max-width:420px}
  .tf{
    flex:1;padding:22px 0;border-radius:22px;border:none;cursor:pointer;
    font:inherit;font-size:26px;font-weight:700;box-shadow:0 6px 0 rgba(0,0,0,.3);
  }
  .tf:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
  .tf.ok{background:var(--lime);color:#1F3A0C}
  .tf.no{background:var(--coral);color:#4A0F0F}
  .timerbar{position:absolute;top:0;left:0;height:5px;background:var(--lime);z-index:14;transition:width .2s linear}
  .timerbar.low{background:var(--coral)}

  /* ============ panels ============ */
  .panel{position:absolute;inset:0;z-index:22;display:none;place-items:center;padding:18px;
    background:rgba(27,15,59,.96);overflow-y:auto}
  .panel.on{display:grid}
  .card2{width:100%;max-width:420px;text-align:center;padding:10px 0}
  .play{
    margin-top:22px;width:100%;padding:18px;border:none;border-radius:20px;cursor:pointer;
    background:var(--lime);color:#1F3A0C;font:inherit;font-size:22px;font-weight:700;
    box-shadow:0 7px 0 #6FA845;transition:transform .1s;
  }
  .play:active{transform:translateY(5px);box-shadow:0 2px 0 #6FA845}
  .play.alt{background:rgba(255,246,229,.12);color:var(--cream);box-shadow:0 7px 0 rgba(0,0,0,.3);
    font-size:18px;margin-top:11px}
  .final{font-size:68px;font-weight:700;color:var(--sunny);line-height:1;font-variant-numeric:tabular-nums;
    text-shadow:0 5px 0 rgba(0,0,0,.22)}
  .final-label{font-size:16px;font-weight:500;color:rgba(255,246,229,.75);margin-top:5px}
  .starrow{display:flex;justify-content:center;gap:9px;margin-top:16px}
  .starrow svg{width:42px;height:42px}
  .starrow .dim{opacity:.2}
  .stats{display:flex;justify-content:center;gap:24px;margin-top:20px;flex-wrap:wrap}
  .stat-num{font-size:25px;font-weight:700;color:var(--cyan)}
  .stat-lab{font-size:12.5px;font-weight:500;color:rgba(255,246,229,.6);margin-top:2px}
  .tricky{margin-top:20px;padding:14px;border-radius:17px;
    background:rgba(61,224,240,.12);border:2px solid rgba(61,224,240,.3)}
  .tricky-head{font-size:14.5px;font-weight:600;color:var(--cyan);margin-bottom:8px}
  .facts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .fact{padding:6px 11px;border-radius:11px;background:rgba(255,246,229,.12);
    font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
  .best{margin-top:12px;font-size:15px;font-weight:600;color:var(--sunny)}
  .pause-title{font-size:34px;font-weight:700;color:var(--cyan)}

  /* ============ keypad ============ */
  #keypad{
    flex:0 0 auto;display:none;grid-template-columns:repeat(3,1fr);gap:6px;
    padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:#150B30;
  }
  #keypad.on{display:grid}
  .key{
    padding:0;height:clamp(36px, 6.6vh, 58px);border-radius:14px;border:none;cursor:pointer;
    background:rgba(255,246,229,.12);color:var(--cream);
    font:inherit;font-size:clamp(17px, 3vh, 25px);font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.35);
  }
  .key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .key.fire{background:var(--lime);color:#1F3A0C;font-size:clamp(14px,2.6vh,21px);box-shadow:0 4px 0 #6FA845}
  .key.del{background:rgba(255,107,107,.24);color:#FFC9C9;font-size:clamp(13px,2.4vh,20px)}

  @media (orientation:landscape) and (min-width:620px){
    #app{flex-direction:row}
    #keypad.on{flex:0 0 210px;width:210px;height:100%;align-content:center;gap:8px;
      padding:12px 12px 12px 0;background:transparent}
    .key{height:clamp(42px, 11vh, 72px);font-size:clamp(19px, 3.4vh, 27px)}
  }
  @media (orientation:landscape) and (max-width:619px){
    #app{flex-direction:row}
    #keypad.on{flex:0 0 152px;width:152px;height:100%;align-content:center;gap:5px;
      padding:6px 8px 6px 0;background:transparent}
    .key{height:clamp(30px, 15vh, 50px);font-size:clamp(15px, 5vh, 22px)}
    .key.fire,.key.del{font-size:clamp(11px, 3.4vh, 16px)}
  }

<div id="app">
<div id="stage">
  <div id="starfield"></div>
  <div class="bigmoon"></div>
  <div class="planet"><div class="ring"></div><div class="ball"></div><div class="ring" style="clip-path:inset(0 0 52% 0)"></div></div>
  <div class="moonground"></div>

  <!-- ===================== HOME ===================== -->
  <div class="screen on" id="home">
    <div class="home-inner">
      <img class="avatar pilot-img" alt="Pilot">
      <h1>Rocket Rescue</h1>
      <p class="tagline">Pick a mission, Captain</p>

      <div class="gamegrid">
        <button class="gamecard gc1" data-game="meteor">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="5" fill="#FFD84D"/><path d="M14 14l6 6" stroke="#FF6BB5" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="18" cy="7" r="2.4" fill="#9BE564"/></svg>
          <div class="gname">Meteor Blast</div>
          <div class="gdesc">Type the answer to shoot down falling meteors</div>
          <div class="gbest" data-best="meteor"></div>
        </button>
        <button class="gamecard gc2" data-game="dash">
          <svg viewBox="0 0 24 24"><ellipse cx="7" cy="12" rx="4" ry="5.5" fill="none" stroke="#3DE0F0" stroke-width="2.6"/><ellipse cx="17" cy="12" rx="4" ry="5.5" fill="none" stroke="#FF6BB5" stroke-width="2.6"/><path d="M12 21V4" stroke="#FFD84D" stroke-width="2.6" stroke-linecap="round"/></svg>
          <div class="gname">Gate Dash</div>
          <div class="gdesc">Steer the rocket through the right ring</div>
          <div class="gbest" data-best="dash"></div>
        </button>
        <button class="gamecard gc3" data-game="match">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="7.5" height="16" rx="2.4" fill="#FFD84D"/><rect x="13.5" y="4" width="7.5" height="16" rx="2.4" fill="#3DE0F0"/></svg>
          <div class="gname">Star Match</div>
          <div class="gdesc">Find the pairs, no rush, no timer</div>
          <div class="gbest" data-best="match"></div>
        </button>
        <button class="gamecard gc4" data-game="quick">
          <svg viewBox="0 0 24 24"><path d="M4 13l5 5L20 6" stroke="#9BE564" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 5l5 5" stroke="#FF6B6B" stroke-width="0" fill="none"/></svg>
          <div class="gname">Right or Wrong</div>
          <div class="gdesc">Is it correct? Decide fast, 45 seconds</div>
          <div class="gbest" data-best="quick"></div>
        </button>
      </div>

      <div class="settings">
        <div class="group">
          <div class="group-label">What shall we practise?</div>
          <div class="choices" id="modechoices">
            <button class="chip" data-mode="add" aria-pressed="false">Adding</button>
            <button class="chip" data-mode="sub" aria-pressed="false">Taking away</button>
            <button class="chip" data-mode="times" aria-pressed="false">Times tables</button>
            <button class="chip" data-mode="div" aria-pressed="false">Dividing</button>
            <button class="chip" data-mode="mix" aria-pressed="true">Mix it up</button>
          </div>
        </div>
        <div class="group">
          <div class="group-label">How hard?</div>
          <div class="choices" id="speedchoices">
            <button class="chip" data-speed="0.68" aria-pressed="false">Easy</button>
            <button class="chip" data-speed="1" aria-pressed="true">Medium</button>
            <button class="chip" data-speed="1.4" aria-pressed="false">Tricky</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== METEOR ===================== -->
  <div class="screen" id="meteor">
    <div id="rocks"></div>
    <div id="domes"></div>
    <div class="rocketwrap" id="mRocket" style="bottom:15%;width:92px;margin-left:-46px"></div>
    <div class="answer empty" id="answer">type the answer</div>
    <input id="sink" type="text" readonly inputmode="none" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Answer entry">
  </div>

  <!-- ===================== DASH ===================== -->
  <div class="screen" id="dash">
    <div class="askbox" id="dashask"></div>
    <div id="gates"></div>
    <div class="rocketwrap" id="dRocket" style="bottom:12%;width:80px;margin-left:-40px"></div>
  </div>

  <!-- ===================== MATCH ===================== -->
  <div class="screen" id="match">
    <div class="matchwrap"><div class="matchgrid" id="matchgrid"></div></div>
  </div>

  <!-- ===================== QUICK ===================== -->
  <div class="screen" id="quick">
    <div class="timerbar" id="qtimer"></div>
    <div class="quickwrap">
      <div class="statement" id="statement">6 &times; 7 = 42</div>
      <div class="tfrow">
        <button class="tf ok" id="btnyes">Yes!</button>
        <button class="tf no" id="btnno">No!</button>
      </div>
    </div>
  </div>

  <!-- ===================== shared chrome ===================== -->
  <div class="topbar" id="topbar" style="display:none">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn-icon" id="backbtn" aria-label="Back to the menu">
        <svg viewBox="0 0 24 24"><path d="M15.4 4.6L7 13l8.4 8.4 2-2L11 13l6.4-6.4z"/></svg>
      </button>
      <div class="pill"><span class="n" id="score">0</span><span id="scorelab">points</span></div>
    </div>
    <div class="icons">
      <div class="lifebar" id="lifebar"></div>
      <button class="btn-icon" id="padbtn" aria-label="Show or hide the number pad">
        <svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 011 1v16a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1zm2 4v2h2V7H6zm5 0v2h2V7h-2zm5 0v2h2V7h-2zM6 11v2h2v-2H6zm5 0v2h2v-2h-2zm5 0v2h2v-2h-2zM6 15v2h2v-2H6zm5 0v2h7v-2h-7z"/></svg>
      </button>
      <button class="btn-icon" id="soundbtn" aria-label="Turn sound off">
        <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
      </button>
      <button class="btn-icon" id="pausebtn" aria-label="Pause">
        <svg viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>
      </button>
    </div>
  </div>

  <div class="banner" id="banner"><div class="big" id="bannerbig"></div><div class="sub" id="bannersub"></div></div>
  <div class="countdown hidden" id="countdown"><div class="num" id="cdnum">3</div></div>

  <div class="panel" id="pausepanel">
    <div class="card2">
      <div class="pause-title">Taking a break</div>
      <button class="play" id="resumebtn">Back to it</button>
      <button class="play alt" id="quitbtn">Leave the mission</button>
    </div>
  </div>

  <div class="panel" id="endpanel">
    <div class="card2">
      <img class="avatar sm pilot-img" alt="Pilot">
      <div class="final" id="finalscore">0</div>
      <div class="final-label" id="finallabel">points</div>
      <div class="starrow" id="starrow"></div>
      <div class="stats" id="statrow"></div>
      <div class="tricky" id="trickybox" style="display:none">
        <div class="tricky-head">Worth practising</div>
        <div class="facts" id="factlist"></div>
      </div>
      <p class="best" id="bestend"></p>
      <button class="play" id="againbtn">Go again!</button>
      <button class="play alt" id="menubtn">Pick another mission</button>
    </div>
  </div>
</div>

<div id="keypad">
  <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>

</div>

  /* ================= sound ================= */
  var soundOn = true, actx = null;
  function audio(){
    if(!actx){ var AC = window.AudioContext||window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(f,dur,type,vol,to){
    if(!soundOn) return;
    var ac = audio(); if(!ac) return;
    try{
      var o=ac.createOscillator(), g=ac.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(f,ac.currentTime);
      if(to) o.frequency.exponentialRampToValueAtTime(to,ac.currentTime+dur);
      g.gain.setValueAtTime(vol||0.09,ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+dur);
      o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur+0.02);
    }catch(e){}
  }
  var sfx = {
    zap:  function(){ tone(1100,0.06,'square',0.05,1800); setTimeout(function(){tone(700,0.13,'triangle',0.08);},50); },
    nope: function(){ tone(200,0.15,'square',0.05,120); },
    crash:function(){ tone(120,0.4,'sawtooth',0.1,50); },
    fix:  function(){ tone(700,0.08,'sine',0.08); setTimeout(function(){tone(950,0.08,'sine',0.08);},75);

    wave: function(){ tone(500,0.1,'triangle',0.08); setTimeout(function(){tone(760,0.18,'triangle',0.08);},110); },
    beep: function(){ tone(620,0.11,'sine',0.07); },

  (function(){

  /* ================= best scores ================= */
  var bests = { meteor:0, dash:0, match:0, quick:0 };
  var BEST_LABEL = { meteor:'Best: ', dash:'Best: ', match:'Fewest turns: ', quick:'Best: ' };
  function paintBests(){
    var els = document.querySelectorAll('[data-best]');
    for(var i=0;i<els.length;i++){
      var k = els[i].getAttribute('data-best');
      els[i].textContent = bests[k] ? BEST_LABEL[k] + bests[k] : '';
    }
  }
  function loadBests(){
    if(!window.storage || !window.storage.get) return;
    Object.keys(bests).forEach(function(k){
      try{
        window.storage.get('rr:best:'+k).then(function(r){
          if(r && r.value){ bests[k] = parseInt(r.value,10)||0; paintBests(); }
        }).catch(function(){});
      }catch(e){}
    });
  }
  function saveBest(k,v){
    bests[k] = v; paintBests();
    if(window.storage && window.storage.set){
      try{ window.storage.set('rr:best:'+k, String(v)).catch(function(){}); }catch(e){}
    }
  }
  loadBests();

  /* ================= problems ================= */
  function ri(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
    return arr;
  }

  // step: 1..n, how far into the game we are; scales difficulty
  function makeProblem(step){
    var kind = cfg.mode;
    if(kind === 'mix') kind = ['add','sub','times','times','div'][Math.floor(Math.random()*5)];
    var lv  = Math.max(1, Math.round(step * cfg.level));
    var top = Math.min(10, 4 + Math.floor(lv/2));
    var a,b,q;
    if(kind === 'add'){ a = ri(2, 9+lv*2); b = ri(2, 9+lv); return { text:a+' + '+b, ans:a+b, op:'+', a:a, b:b }; }
    if(kind === 'sub'){ a = ri(6, 12+lv*2); b = ri(1, Math.max(2,a-1)); return { text:a+' \u2212 '+b, ans:a-b, op:'\u2212', a:a, b:b }; }
    if(kind === 'div'){ b = ri(2, top); q = ri(2, top); a = b*q; return { text:a+' \u00F7 '+b, ans:q, op:'\u00F7', a:a, b:b }; }
    a = ri(2, top); b = ri(2, 10);
    return { text:a+' \u00D7 '+b, ans:a*b, op:'\u00D7', a:a, b:b };
  }

  // believable wrong answers: adjacent multiples, off-by-one, off-by-ten
  function distractors(p, howMany){
    var pool = [p.ans+1, p.ans-1, p.ans+2, p.ans-2, p.ans+10, p.ans-10];
    if(p.op === '\u00D7'){ pool = [p.ans+p.a, p.ans-p.a, p.ans+p.b, p.ans-p.b, p.ans+1, p.ans-1, p.ans+10]; }
    if(p.op === '\u00F7'){ pool = [p.ans+1, p.ans-1, p.ans+2, p.b, p.ans*2]; }
    shuffle(pool);
    var seen = {}, out = [];
    seen[p.ans] = true;
    for(var i=0;i<pool.length && out.length<howMany;i++){
      if(pool[i] > 0 && !seen[pool[i]]){ seen[pool[i]] = true; out.push(pool[i]); }
    }
    while(out.length < howMany){
      var g = p.ans + ri(-6,6);
      if(g > 0 && !seen[g]){ seen[g] = true; out.push(g); }
    }
    return out;
  }

  /* ================= effects ================= */
  function pctToPx(x,y){

      s.style.left = p.x+'px'; s.style.top = p.y+'px';
      s.style.background = colors[i % colors.length];
      stage.appendChild(s);
      (function(el, ang, dist){
        var t0 = performance.now();
        function step(t){
          var k = (t-t0)/520;
          if(k >= 1){ if(el.parentNode) el.parentNode.removeChild(el); return; }
          el.style.transform = 'translate('+(Math.cos(ang)*dist*k)+'px,'+(Math.sin(ang)*dist*k + 60*k*k)+'px) rotate('+(k*420)+'deg)';
          el.style.opacity = (1-k).toFixed(2);
          requestAnimationFrame(step);

    var dt = E.lastT ? Math.min((t - E.lastT)/1000, 0.05) : 0.016;

  GAMES.dash = (function(){

        }

                score:E.score, label:'points', bestKey:'dash', bestValue:E.score,
                stars: S.cleared>=18?3:S.cleared>=8?2:1,
                stats:[[S.cleared,'rings flown'],[(S.tries?Math.round(S.cleared/S.tries*100):0)+'%','spot on']],
                facts: topMisses(S.miss)
              });
              return;
            }
          }
          var old = S.row;
          setTimeout(function(){
            if(old.el.parentNode) old.el.parentNode.removeChild(old.el);
          }, 500);
          S.row = null;
          newProblem();
          var self = this;
          setTimeout(function(){ if(E.running && !S.row) spawnRow(); }, 620);
        }
      }
    };
  })();

  /* ============================================================
     GAME 3 — STAR MATCH
     ============================================================ */
  GAMES.match = (function(){
    var grid, S = {};
    var STAR = '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg>';

    function build(){
      var pairs = [], seen = {};
      var guard = 0;
      while(pairs.length < 6 && guard++ < 200){
        var p = makeProblem(2 + pairs.length);
        if(seen[p.ans] || seen[p.text]) continue;   // answers must be unique or matching is ambiguous
        seen[p.ans] = true; seen[p.text] = true;
        pairs.push(p);
      }
      var cards = [];
      pairs.forEach(function(p, i){
        cards.push({ pair:i, text:p.text, isAns:false });
        cards.push({ pair:i, text:String(p.ans), isAns:true });
      });
      shuffle(cards);
      S.total = pairs.length;
      grid.innerHTML = cards.map(function(c, i){
        return '<button class="card'+(c.isAns?' ans':'')+'" data-i="'+i+'" data-pair="'+c.pair+'">'+
               '<div class="cardin">'+
                 '<div class="cface cback">'+STAR+'</div>'+
                 '<div class="cface cfront">'+c.text+'</div>'+
               '</div></button>';
      }).join('');
      S.cards = cards;
    }

    function onTap(e){
      var b = e.target.closest('.card');
      if(!b || !E.running || E.paused) return;
      if(b.classList.contains('done') || b.classList.contains('flip')) return;
      if(S.busy) return;
      b.classList.add('flip');
      sfx.flip();
      if(S.first === null){ S.first = b; return; }

      S.turns++;
      setScore(S.turns, 'turns');
      var a = S.first, bb = b;
      S.first = null;
      if(a.getAttribute('data-pair') === bb.getAttribute('data-pair')){
        a.classList.add('done'); bb.classList.add('done');
        S.found++;
        sfx.fix();
        var r = bb.getBoundingClientRect(), sr = stage.getBoundingClientRect();
        sparkle((r.left+r.width/2-sr.left)/sr.width*100, (r.top+r.height/2-sr.top)/sr.height*100,
                ['#9BE564','#FFD84D','#FFF6E5']);
        if(S.found === S.total){
          setTimeout(function(){
            finish({
              score:S.turns, label:'turns taken', bestKey:'match', bestValue:S.turns, lowerIsBetter:true,
              stats:[[S.found,'pairs found'],[Math.round((performance.now()-S.t0)/1000)+'s','time']],
              stars: S.turns<=S.total+3?3:S.turns<=S.total+8?2:1
            });
          }, 700);
        }
      } else {
        S.busy = true;
        sfx.nope();
        setTimeout(function(){
          a.classList.remove('flip'); bb.classList.remove('flip'); S.busy = false;
        }, 850);
      }
    }

    return {
      noPause:true,
      scoreLabel:'turns',
      start:function(){
        grid = $('matchgrid');
        S = { first:null, busy:false, turns:0, found:0, total:6, t0:performance.now() };
        build();
        setScore(0, 'turns');
        grid.addEventListener('click', onTap);
        showBanner('Find the pairs', 'Match each sum to its answer');
      },
      stop:function(){ if(grid){ grid.removeEventListener('click', onTap); grid.innerHTML = ''; } },
      update:function(){}
    };
  })();

  /* ============================================================
     GAME 4 — RIGHT OR WRONG
     ============================================================ */
  GAMES.quick = (function(){
    var ROUND = 45;
    var el, bar, S = {};

    function nextOne(){
      var p = makeProblem(1 + Math.floor(S.answered/4));
      var showTrue = Math.random() < 0.5;
      var shown = showTrue ? p.ans : distractors(p, 1)[0];
      S.now = { text:p.text, shown:shown, correct:shown === p.ans };
      el.textContent = p.text + ' = ' + shown;
      el.classList.remove('yes','no');
    }

    function judge(saidYes){
      if(!E.running || E.paused || !S.now) return;
      S.answered++;
      var right = (saidYes === S.now.correct);
      if(right){
        S.right++; S.streak++;
        var gain = 10 + Math.min(S.streak, 6)*2;
        setScore(E.score + gain);
        el.classList.add('yes');
        sfx.zap();
        if(S.streak > 0 && S.streak % 5 === 0) praiseAt(50, 34, S.streak+' in a row!');
      } else {
        S.streak = 0;
        S.miss[S.now.text] = (S.miss[S.now.text]||0)+1;
        S.left = Math.max(0, S.left - 2);   // a wrong call costs two seconds
        el.classList.add('no');
        sfx.nope();
      }
      setTimeout(nextOne, 190);
    }

    return {
      scoreLabel:'points',
      start:function(){
        el = $('statement'); bar = $('qtimer');
        S = { left:ROUND, answered:0, right:0, streak:0, miss:{}, now:null };
        bar.style.width = '100%'; bar.classList.remove('low');
        hearts(0,0);
        nextOne();
        countdown(function(){ showBanner('Go!', 'Is it right or wrong?'); });
      },
      stop:function(){},
      answer: judge,
      update:function(dt){
        S.left -= dt;
        if(S.left <= 0){
          S.left = 0;
          finish({
            score:E.score, label:'points', bestKey:'quick', bestValue:E.score,
            stars: S.right>=28?3:S.right>=16?2:1,
            stats:[[S.right,'correct'],[S.answered,'answered'],
                   [(S.answered?Math.round(S.right/S.answered*100):0)+'%','spot on']],
            facts: topMisses(S.miss)
          });
          return;
        }
        var pct = S.left/ROUND*100;
        bar.style.width = pct+'%';
        bar.classList.toggle('low', pct < 25);
      }
    };
  })();

  /* ================= input routing ================= */
  function onKey(e){
    if(e.key === 'Escape'){ if(E.running && E.game && !E.game.noPause) setPaused(!E.paused); return; }
    if(!E.running || E.paused) return;
    var g = E.game;
    if(!g) return;
    if(g === GAMES.meteor){
      if(e.key >= '0' && e.key <= '9'){ audio(); g.key(e.key); e.preventDefault(); return; }
      if(e.key === 'Backspace' || e.key === 'Delete'){ g.key('back'); e.preventDefault(); return; }
      if(e.key === 'Enter' || e.key === ' '){ g.key('fire'); e.preventDefault(); return; }
    }
    if(g === GAMES.dash){
      if(e.key === 'ArrowLeft'  || e.key === 'a'){ g.nudge(-9); e.preventDefault(); return; }
      if(e.key === 'ArrowRight' || e.key === 'd'){ g.nudge( 9); e.preventDefault(); return; }
    }
    if(g === GAMES.quick){
      if(e.key === 'ArrowLeft'  || e.key === 'y' || e.key === 'Enter'){ g.answer(true);  e.preventDefault(); return; }
      if(e.key === 'ArrowRight' || e.key === 'n'){ g.answer(false); e.preventDefault(); return; }
    }
  }
  document.addEventListener('keydown', onKey, true);
  $('sink').addEventListener('keydown', onKey);

  // dragging steers the rocket in Gate Dash
  function stagePointer(e){
    if(E.game !== GAMES.dash || !E.running || E.paused) return;
    var r = stage.getBoundingClientRect();
    GAMES.dash.move((e.clientX - r.left)/r.width*100);
  }
  stage.addEventListener('pointerdown', function(e){
    if(e.target.closest('.panel') || e.target.closest('.topbar') || e.target.closest('#home')) return;
    audio();
    if(E.game === GAMES.meteor && E.game.focus) E.game.focus();
    stagePointer(e);
  });
  stage.addEventListener('pointermove', function(e){
    if(e.buttons || e.pointerType === 'touch') stagePointer(e);
  });

  keypad.addEventListener('mousedown', function(e){ e.preventDefault(); });
  keypad.addEventListener('click', function(e){
    var b = e.target.closest('.key');
    if(!b || !E.game || !E.game.key) return;
    audio();
    E.game.key(b.getAttribute('data-k'));
  });

  $('btnyes').addEventListener('click', function(){ audio(); GAMES.quick.answer(true); });
  $('btnno').addEventListener('click',  function(){ audio(); GAMES.quick.answer(false); });

  document.addEventListener('visibilitychange', function(){
    if(document.hidden && E.running && !E.paused && E.game && !E.game.noPause) setPaused(true);
  });

  /* ================= menu wiring ================= */
  document.querySelector('.gamegrid').addEventListener('click', function(e){
    var b = e.target.closest('.gamecard');
    if(b) launch(b.getAttribute('data-game'));
  });

  function wireChips(id, attr, apply){
    var box = $(id);
    box.addEventListener('click', function(e){
      var btn = e.target.closest('.chip');
      if(!btn) return;
      var all = box.querySelectorAll('.chip');
      for(var i=0;i<all.length;i++) all[i].setAttribute('aria-pressed','false');
      btn.setAttribute('aria-pressed','true');
      apply(btn.getAttribute(attr));
    });
  }
  wireChips('modechoices','data-mode', function(v){ cfg.mode = v; });
  wireChips('speedchoices','data-speed', function(v){ cfg.level = parseFloat(v); });

  $('backbtn').addEventListener('click', goHome);
  $('menubtn').addEventListener('click', goHome);
  $('quitbtn').addEventListener('click', goHome);
  $('resumebtn').addEventListener('click', function(){ setPaused(false); });
  $('pausebtn').addEventListener('click', function(){ setPaused(true); });
  $('againbtn').addEventListener('click', function(){
    var name = null;
    for(var k in GAMES) if(GAMES[k] === E.game) name = k;
    if(name) launch(name);
  });
  $('soundbtn').addEventListener('click', function(){
    soundOn = !soundOn;
    this.classList.toggle('off', !soundOn);
    this.setAttribute('aria-label', soundOn ? 'Turn sound off' : 'Turn sound on');
  });
  $('padbtn').addEventListener('click', function(){
    keypad.classList.toggle('on');
    this.classList.toggle('off', !keypad.classList.contains('on'));
  });

  paintBests();
})();
</script>
